<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='../icons/budget-svgrepo-com.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

</head>
<body class="inter-budget">
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h2>BUDGET4U</h2>
                <p>Your pocket accountant!</p>
            </div>
            <nav>
                <a href="{{ url_for('dashboard') }}" class="active">Dashboard<img src="{{ url_for('static', filename='icons/graph-up-svgrepo-com.svg') }}" alt="Dashboard icon"></a>
                <a href="{{ url_for('transactions') }}" >My Transactions<img src="{{ url_for('static', filename='icons/log-svgrepo-com.svg') }}" alt="Transactions icon"></a>
                <a href="{{ url_for('boxes') }}">My Boxes
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m7.875 14.25 1.214 1.942a2.25 2.25 0 0 0 1.908 1.058h2.006c.776 0 1.497-.4 1.908-1.058l1.214-1.942M2.41 9h4.636a2.25 2.25 0 0 1 1.872 1.002l.164.246a2.25 2.25 0 0 0 1.872 1.002h2.092a2.25 2.25 0 0 0 1.872-1.002l.164-.246A2.25 2.25 
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c .55 
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9,3 L3,3 C3,3,3,3,3,3 L3,3 C3,3,3,3,3,3 L3,3 C3,3,3,3,3,3 L9,3 Z M9,7 L7,7 C7,7,7,7,7,7 L7,
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="header-section">
                <div class="header-text fraunces-budget">
                    <h1>Maswera bwanji {{ session.get('user_id') }}</h1>
                    <p>Here's a quick overview of your finances...</p>
                </div>
                <div class="account-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
</svg>
                </div>
            </header>
            
            <section class="overview-section">
                <div class="card income-card">
                    <span class="icon">↑</span>
                    <h3 id="total-income">MK 0</h3>
                    <p>Total Income</p>
                </div>
                                
                <div class="card expenditure-card">
                    <span class="icon">↓</span>
                    <h3 id="total-expenditure">MK 0</h3>
                    <p>Total Expenditure</p>
                </div>
                
                <div class="card daily-expenditure-card">
                    
                    <p>Daily Expenditure</p>
                </div>
                
                <div class="card category-breakdown-card">
                    <!-- Category breakdown content -->
                </div>
                
                <button class="btn reports-btn">Reports and Analytics
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                    </svg>
                </button>
                <button class="add-transaction-btn btn">Record Transaction
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                </button>
                <button class="btn ai-advisor-btn">AI financial advisor<img src="../icons/ai-svgrepo-com.svg" alt="AI symbol"></button>
            </section>
        </main>
    </div>
</body>
<script>
    async function updateDashboard() {
        try {
            const response = await fetch('/api/stats');
            const data = await response.json();

            if (data.income !== undefined) {
                // Formatting the numbers to have commas (e.g., 67,100)
                document.getElementById('total-income').innerText = 
                    "MK " + data.income.toLocaleString();
                
                document.getElementById('total-expenditure').innerText = 
                    "MK " + data.expenditure.toLocaleString();
            }
        } catch (err) {
            console.error("Dashboard update failed:", err);
        }
    }

    // Run when page loads
    window.addEventListener('DOMContentLoaded', updateDashboard);
</script>
</html>
