<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="loginStyle.css">
    <title>Login</title>
</head>
<script>

</script>

<body>
    <div class="loginBox">
        <div class="loginHeader">
            <header>Sign IN</header>
        </div>
        <div class="inputBox">
            <input type="text" class="inputField" placeholder="Email" autocomplete="off" required>
        </div>
        <div class="inputBox">
            <input type="password" class="inputField" placeholder="Password" autocomplete="off" required>
        </div>
        <div class="forgot">
            <section>
                <input type="checkbox" id="check">
                <label for="check">Remember Me</label>
            </section>
            <section>
                <a href="#">Forgot Password?</a>
            </section>
        </div>
        <div class="inputSubmit">
            <button type="submit" class="submitBtn" >Jump In</button>
        </div>
        <div class="signUp">
            <p>Don't have an account? <a href="#">Sign Up</a></p>
        </div>
    </div>
</body>

</html>
