<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>B4U | My Boxes</title>
</head>
<body class="inter-budget">
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h2>BUDGET4U</h2>
                <p>Your pocket accountant!</p>
            </div>
            <nav>
                <a href="index.html" >Dashboard<img src="icons/graph-up-svgrepo-com.svg" alt="Dashboard icon"></a>
                <a href="transactions.html" >My Transactions<img src="icons/log-svgrepo-com.svg" alt="Transactions icon"></a>
                <a href="boxes.html" class="active" >My Boxes
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m7.875 14.25 1.214 1.942a2.25 2.25 0 0 0 1.908 1.058h2.006c.776 0 1.497-.4 1.908-1.058l1.214-1.942M2.41 9h4.636a2.25 2.25 0 0 1 1.872 1.002l.164.246a2.25 2.25 0 0 0 1.872 1.002h2.092a2.25 2.25 0 0 0 1.872-1.002l.164-.246A2.25 2.25 0 0 1 16.954 9h4.636M2.41 9a2.25 2.25 0 0 0-.16.832V12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 12V9.832c0-.287-.055-.57-.16-.832M2.41 9a2.25 2.25 0 0 1 .382-.632l3.285-3.832a2.25 2.25 0 0 1 1.708-.786h8.43c.657 0 1.281.287 1.709.786l3.284 3.832c.163.19.291.404.382.632M4.5 20.25h15A2.25 2.25 0 0 0 21.75 18v-2.625c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125V18a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>
                </a>
                <a href="#">Settings 
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="header-section">
                <div class="header-text fraunces-budget">
                    <h1>Sand Boxes</h1>
                </div>
            </header>
        <div class="modal-container">
        <i class="fas fa-times close-btn"></i>
            <h2 class="">Record Transaction</h2>
        <form action="#">
            <div class="input-group">
                <label class="">Amount (MWK)</label>
                <input type="text" class="styled-input amount-input" placeholder="0.00" autofocus>
            </div>
            <div class="flow-bridge">
                <div class="flex-1">
                    <label class="input-label !ml-0 text-center">From (Box)</label>
                    <select class="styled-input !py-2 !text-xs">
                        <option>Airtel Money</option>
                        <option>TNM Mpamba</option>
                        <option>FDH Bank</option>
                        <option>External Revenue</option>
                    </select>
                </div>
                <div class="text-slate-300 mt-4">
                    <i class="fas fa-long-arrow-right text-xl"></i>
                </div>
                <div class="flex-1">
                    <label class="input-label !ml-0 text-center">To (Box)</label>
                    <select class="styled-input !py-2 !text-xs">
                        <option>Transportation</option>
                        <option>Inventory</option>
                        <option>Shop Rent</option>
                        <option>Savings</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Description</label>
                <input type="text" class="styled-input" placeholder="e.g. Hired truck for furniture">
            </div>
            <div class="input-group">
                <label class="input-label">Transaction Date</label>
                <input type="date" class="styled-input" value="2026-01-17">
            </div>
            <button type="submit" class="btn-confirm">
                Record
            </button>
        </form>
    </div>
        </main>
    </div>
    <style>
  
        .modal-container {
            border: 1px solid black;
            border-radius: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.15);
            padding: 2.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--slate-900);
            letter-spacing: -0.05em;
            margin: 0;
        }

        .modal-subtitle {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--slate-400);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.25rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--slate-400);
            margin-bottom: 0.5rem;
            margin-left: 0.5rem;
        }

        .label-center {
            text-align: center;
            margin-left: 0;
        }

        .styled-input {
            width: 100%;
            box-sizing: border-box;
            background: white;
            border: 1px solid var(--slate-200);
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--slate-900);
            transition: all 0.2s;
        }

        .styled-input:focus {
            outline: none;
            border-color: var(--indigo-600);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .amount-input {
            font-size: 1.5rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .flow-bridge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0;
            padding: 1rem;
            background: rgba(0,0,0,0.03);
            border-radius: 1.5rem;
        }

        .flex-1 {
            flex: 1;
        }

        .bridge-icon {
            color: var(--slate-300);
            margin-top: 1rem;
            font-size: 1.25rem;
        }

        .select-small {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            font-size: 0.75rem;
        }

        .btn-confirm {
            background: var(--slate-900);
            color: white;
            width: 100%;
            padding: 1.2rem;
            border: none;
            border-radius: 1.2rem;
            font-weight: 900;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.4);
            background: #1e293b;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            color: var(--slate-400);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .security-footer {
            font-size: 10px;
            text-align: center;
            color: var(--slate-400);
            font-weight: 800;
            margin-top: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</body>
</html>
