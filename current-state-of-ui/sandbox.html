        <main class="main-content">
            <header class="header-section">
                <div class="header-text fraunces-budget">
                    <h1>Sand Boxes</h1>
                </div>
            </header>
       <button id="openBtn">Open</button>
        </main>
    </div>
     <div class="hidden" id="modal-container">
            <button id="closeBtn"><img src="icons/close-square-svgrepo-com.svg"></button>
            <h2>Record a transaction</h2>
            <form action="#" class="transaction-form">
  <label for="amount">Amount (MWK)</label>
  <input type="text" id="amount" placeholder="0.00" autofocus>

  <label for="from-box">From (Box)</label>
  <select id="from-box">
    <option>Airtel Money</option>
    <option>TNM Mpamba</option>
    <option>FDH Bank</option>
    <option>External Revenue</option>
  </select>

  <label for="to-box">To (Box)</label>
  <select id="to-box">
    <option>Transportation</option>
    <option>Inventory</option>
    <option>Shop Rent</option>
    <option>Savings</option>
  </select>

  <label for="description">Description</label>
  <input type="text" id="description" placeholder="e.g. Hired truck for furniture">

  <label for="date">Transaction Date</label>
  <input type="date" id="date" value="2026-01-15">

  <button type="submit">Record</button>
            </form>
    </div>
    <div class="hidden" id="edit-transaction-modal">
    <button id="closeEditTransaction"><img src="icons/close-square-svgrepo-com.svg"></button>
    <h2>Edit Transaction</h2>
    <form action="#" class="transaction-form">
        <label for="edit-amount">Amount (MWK)</label>
        <input type="text" id="edit-amount" value="50,000" autofocus>

        <label for="edit-from">From (Box)</label>
        <select id="edit-from">
            <option selected>Airtel Money</option>
            <option>TNM Mpamba</option>
            <option>FDH Bank</option>
            <option>External Revenue</option>
        </select>

        <label for="edit-to">To (Box)</label>
        <select id="edit-to">
            <option selected>Transportation</option>
            <option>Inventory</option>
            <option>Shop Rent</option>
            <option>Savings</option>
        </select>

        <label for="edit-description">Description</label>
        <input type="text" id="edit-description" value="Hired truck for furniture">

        <label for="edit-date">Transaction Date</label>
        <input type="date" id="edit-date" value="2026-01-15">

        <button type="submit">Update Transaction</button>
    </form>
    </div>
    
    <style>
 /* Using the lighter version of your background color */

.transaction-form {
  display: flex;
  flex-direction: column;
  max-width: 350px;
}

.modal-container{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: white;
    border: 1px solid black;
    padding: 1rem;
    width:fit-content;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    z-index: 999;
}
.hidden{
    display: none;
}
.blurred {
  filter: blur(5px);
  pointer-events: none; /* Prevents clicking background links while modal is open */
}

button img{
    width: 2rem;
    height: 2rem;
}
.transaction-form label {
  font-size: 0.85rem;
  font-weight: 600;
  color: #444;
  margin-bottom: 4px;
  margin-top: 12px;
}

/* Input & Select styling */
.transaction-form input, 
.transaction-form select {
  padding: 10px;
  background-color: #ffffff; /* White boxes pop against cream bg */
  border: 1px solid #999;    /* Darker border for visibility */
  border-radius: 6px;
  font-size: 1rem;
  outline: none;
}

/* High visibility focus state */
.transaction-form input:focus, 
.transaction-form select:focus {
  border-color: #000;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
}

/* Button styling */
.transaction-form button {
  margin-top: 20px;
  padding: 12px;
  background-color: #222; /* Dark button for high contrast */
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}
    </style>
    <script>
const openBtn = document.getElementById('openBtn');
const closeBtn = document.getElementById('closeBtn');
const modal = document.getElementById('modal-container');
const container = document.getElementById('container');

// Open Modal
openBtn.addEventListener('click', () => {
  modal.classList.remove('hidden');
  modal.classList.add('modal-container');
  container.classList.add('blurred');
});

// Close Modal
closeBtn.addEventListener('click', () => {
  modal.classList.remove('modal-container');
  modal.classList.add('hidden');
  container.classList.remove('blurred');
});
        </script>
</body>
