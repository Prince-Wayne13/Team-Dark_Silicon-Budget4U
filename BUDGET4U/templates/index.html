<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
<script>
  const ctxa = document.getElementById('weeklyExpenseBarChart');
  const ctxb = document.getElementById('categoriesPolarChart');

  new Chart(ctxa, {
    type: 'bar',
    data: {
      labels: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Sartuday', 'Sunday'],
      datasets: [
        {label: 'Income',
        data: [12000, 19000, 3000, 15000, 12500, 300, 25000],
        borderWidth: 1
        },
        {label: 'Expenses',
        data: [1200, 12000, 8000, 18000, 2500, 100, 45000],
        borderWidth: 1
        },
       
       ] 
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

  new Chart (ctxb,{
    type: 'polarArea',
    data: {
      labels: ['Transport', 'Rent', 'Inventory', 'Utilities', 'Tax', 'Marketing'],
      datasets: [
        {label: 'Amount',
        data: [130000, 25000, 3000, 15000, 125000, 100000, 55000],
        borderWidth: 1,
        }]
    },
    options: {
        scales: {
            r: {
                suggestedMin: 0,
                suggestedMax: 10
            }
        }
    }
    }
  );
  async function updateDashboard() {
        try {
            const response = await fetch('/api/stats');
            const data = await response.json();

            if (data.income !== undefined) {
                // Formatting the numbers to have commas (e.g., 67,100)
                document.getElementById('total-income').innerText = 
                    "MK " + data.income.toLocaleString();
                
                document.getElementById('total-expenditure').innerText = 
                    "MK " + data.expenditure.toLocaleString();
            }
        } catch (err) {
            console.error("Dashboard update failed:", err);
        }
    }

    // Run when page loads
    window.addEventListener('DOMContentLoaded', updateDashboard);
</script>

</html>
