<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='loginStyle.css') }}">
    <title>Budget4U - Sign Up</title>
</head>
<body>
    <div class="loginBox">
        <div class="loginHeader">
            <header>Sign UP</header>
        </div>
        
        <div id="message" style="font-size: 14px; margin-bottom: 10px; height: 20px;"></div>

        <div class="inputBox">
            <input type="text" id="signup-email" class="inputField" placeholder="Email" autocomplete="off" required>
        </div>
        <div class="inputBox">
            <input type="password" id="signup-password" class="inputField" placeholder="Password" autocomplete="off" required>
        </div>
        
        <div class="forgot">
            <section>
                <input type="checkbox" id="check">
                <label for="check">Remember Me</label>
            </section>
        </div>

        <div class="inputSubmit">
            <button type="submit" id="signupBtn" class="submitBtn">Sign up</button>
        </div>

        <div class="login">
            <p>Already have an account? <a href="{{ url_for('login_page') }}">Login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('signupBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const messageDiv = document.getElementById('message');

            if (!email || !password) {
                messageDiv.style.color = "#d9534f";
                messageDiv.innerText = "Email and Password are required.";
                return;
            }

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });

                if (response.ok) {
                    messageDiv.style.color = "#2563EB";
                    messageDiv.innerText = "Check your email! You must verify your account before you can log in.";
                    
                    // Redirect to Login page, not Dashboard
                    setTimeout(() => {
                        window.location.href = "{{ url_for('login_page') }}";
                    }, 5000); 
                }
                 else {
                    const errorText = await response.text();
                    messageDiv.style.color = "#d9534f";
                    messageDiv.innerText = errorText;
                }
            } catch (error) {
                messageDiv.innerText = "Connection failed.";
            }
        });
    </script>
</body>
</html>
